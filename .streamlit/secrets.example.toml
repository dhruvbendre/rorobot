# Roro · Streamlit secrets
#
# Streamlit Community Cloud: open the app → Settings → Secrets, paste this
# whole file, fill in what you use, save. Locally: copy it to
# .streamlit/secrets.toml (ignored by git) or use .env instead.
#
# Every value is optional. With no keys at all Roro runs in no-model mode:
# it still finds the right passages and refuses what it cannot ground, but
# returns the passages verbatim instead of writing an answer.

# ---- model provider ----------------------------------------------------------
# "openai" | "anthropic" | "none". Blank = auto: anthropic if its key is set,
# else openai, else none.
LLM_PROVIDER = ""

# Anthropic (recommended). Default chat model: claude-opus-5.
ANTHROPIC_API_KEY = ""

# OpenAI, or any OpenAI-compatible endpoint (set OPENAI_BASE_URL for the latter).
# Groq example: OPENAI_API_KEY = "gsk_...", OPENAI_BASE_URL = "https://api.groq.com/openai/v1",
#               MODEL_NAME = "openai/gpt-oss-120b", EMBEDDING_PROVIDER = "local"
OPENAI_API_KEY = ""
OPENAI_BASE_URL = ""

# Chat model override. Blank = claude-opus-5 (anthropic) or gpt-4o-mini (openai).
MODEL_NAME = ""

# ---- embeddings --------------------------------------------------------------
# "openai" | "local". Blank = openai if a real OpenAI key is set, else local.
# "local" is a keyless hashed fallback: fine for this small archive.
EMBEDDING_PROVIDER = ""
EMBEDDING_MODEL = "text-embedding-3-small"

# ---- retrieval ---------------------------------------------------------------
RETRIEVAL_TOP_K = "5"
# Blank = 0.30 with OpenAI embeddings, 0.18 with local ones.
RETRIEVAL_MIN_SCORE = ""
MAX_CONTEXT_CHARS = "9000"
HISTORY_TURNS = "6"
CONDENSE_FOLLOWUPS = "true"
MAX_ANSWER_TOKENS = "160"

# ---- identity ----------------------------------------------------------------
ARCHIVE_NAME = "Mnemora"
BOT_NAME = "Roro"
BOT_TAGLINE = "keeper of the archive"
OWNER_NAME = "Dhruv Bendre"
OWNER_SHORT = "Dhruv"
ARCHIVE_TAGLINE = "Ask the archive about Dhruv."
ARCHIVE_EMPTY_STATE = "Ask me anything about Dhruv."

# The portfolio the "Back to the system" link returns to (your Vercel URL).
PORTFOLIO_URL = "https://your-portfolio.vercel.app"

# ---- storage -----------------------------------------------------------------
# Leave blank on Streamlit Cloud: knowledge/ ships with the repo and the
# index is rebuilt on start.
KNOWLEDGE_DIR = ""
INDEX_DIR = ""
INCLUDE_TEST_DATA = "false"
